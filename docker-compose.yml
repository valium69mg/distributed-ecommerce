version: '3.8'

services:
  users:
    image: carlostranquilinocr98/ecommerce:users
    container_name: users
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      DB_HOST: 192.168.100.49
      DB_USER: root
      DB_PASS: admin
      DB_NAME: ecommerce_users
      DB_PORT: 3306
      JWT_SECRET: shhhhhhhhhhhhh
    networks:
      - ecommerce-net

  products:
    image: carlostranquilinocr98/ecommerce:products
    container_name: products
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      DB_HOST: 192.168.100.49
      DB_USER: carlostr
      DB_PASSWORD: carlostr
      DB_NAME: ecommerce_products
      DB_PORT: 5432
      AUTH_ADDRESS: users:3000
      KAFKA_HOST: kafka-1
      KAFKA_PORT: 9092
    networks:
      - ecommerce-net

  orders:
    image: carlostranquilinocr98/ecommerce:orders
    container_name: orders
    ports:
      - "4000:4000"
    restart: unless-stopped
    environment:
      DB_HOST: 192.168.100.49
      DB_USER: root
      DB_PASS: admin
      DB_NAME: ecommerce_orders
      DB_PORT: 3306
      PRODUCTS_HOST: products
      PRODUCTS_PORT: 8000
      KAFKA_HOST: kafka-1
      KAFKA_PORT: 9092
    networks:
      - ecommerce-net

  kafka-1: 
    image: bitnami/kafka:latest
    container_name: kafka-1
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_KRAFT_CLUSTER_ID=3c628b23-922c-4c21-888f-de3520060ea5
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka-1:9091
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9090,CONTROLLER://:9091,EXTERNAL://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka-1:9090,EXTERNAL://kafka-1:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
    volumes:
      - kafka_data:/bitnami/kafka
    networks:
      - ecommerce-net

volumes:
  kafka_data:

networks:
  ecommerce-net:
    driver: bridge
